######################################################################
# HTTP: ACME チャレンジのみ許可し、それ以外は HTTPS へリダイレクト
######################################################################
server {
    listen 80;
    server_name api.daenishi.org;

    # ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # その他は HTTPS へ
    location / {
        return 301 https://$host$request_uri;
    }
}

######################################################################
# HTTPS server (Let's Encrypt 証明書)
######################################################################
server {
    listen 443 ssl http2;
    server_name api.daenishi.org;

    ssl_certificate     /etc/letsencrypt/live/api.daenishi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daenishi.org/privkey.pem;

    # 推奨SSL設定（簡易）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # セキュリティヘッダ（必要に応じて調整）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Media files (GET/HEAD のみ)
    location /media/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /app/media/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Application
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
