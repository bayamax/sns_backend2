server {
    listen 80;
    server_name _;

    # Media files
    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Application
    location / {
        proxy_pass http://web:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300;
    }
}
