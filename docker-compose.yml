version: '3'

services:
  web:
    build: .
    command: gunicorn sns_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/empty:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/custom.conf:ro
      - static_volume:/app/staticfiles
      - ./media:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  cron:
    build: .
    command: python manage.py run_scheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - db

volumes:
  postgres_data:
  static_volume:

