version: '3'

services:
  web:
    build: .
    command: gunicorn sns_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/empty:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/custom.conf:ro
      # Let's Encrypt 用: 証明書と ACME チャレンジパス
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt
      - static_volume:/app/staticfiles
      - ./media:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  cron:
    build: .
    command: python manage.py run_scheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - db

volumes:
  postgres_data:
  static_volume:

